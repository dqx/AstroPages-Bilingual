name: Telegram Weekly Sync

# 每周五 12:00 UTC (北京时间周五 20:00) 执行
on:
  schedule:
    - cron: "0 12 * * 5"
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Telegram to Blog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "📡 Fetch Telegram messages"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DAYS_BACK: 7
          LANGUAGE: zh
        run: node scripts/fetch-telegram.js

      - name: "📝 Check for changes"
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到站点"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⚠️  没有新站点"
          fi

      - name: "🚀 Commit and push"
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/blog/
          git commit -m "chore: 自动同步 Telegram 站点"
          git push

      - name: "✅ Sync completed"
        if: steps.check_changes.outputs.has_changes == 'true'
        run: echo "✅ Telegram 站点已同步并推送到仓库"

      - name: "ℹ️ No changes"
        if: steps.check_changes.outputs.has_changes == 'false'
        run: echo "ℹ️ 本周没有新站点需要同步"
